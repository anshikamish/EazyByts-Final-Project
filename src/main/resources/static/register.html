<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register | News Aggregator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-body">

  <div class="form-container">
    <h2>📝 Register</h2>

    <form id="register-form" onsubmit="registerUser(event)">
      <input type="text" id="reg-name" placeholder="Full Name" required />
      <input type="email" id="reg-email" placeholder="Email" required />
      <input type="password" id="reg-password" placeholder="Password" required />
      <button type="submit">Register</button>
    </form>

    <p id="register-message"></p>
    <p class="link-text" style="text-align: center; margin-top: 20px; width: 100%; display: block;">
  Already have an account? <a href="login.html" style="font-weight: bold; text-decoration: underline;">Login</a>
</p>
  </div>

  <script src="auth.js"></script>
</body>
</html>
