<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📰 News Aggregator - Home</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="home-body">

  <header class="header">
    <h1>📰 Top News Headlines</h1>
    <nav class="navbar">
      <a href="index.html">🏠 Home</a>
      <a href="preferences.html">⚙️ Preferences</a>
      <a href="#" onclick="logoutUser()">🚪 Logout</a>
    </nav>
  </header>

  <!-- 🔎 Merged Search + Category + Country Bar -->
  <div class="search-filter-container merged-bar">
    <input type="text" id="search-input" placeholder="🔍 Search news..." />
    
    <select id="category-select" onchange="filterByCategory()">
      <option value="">All Categories</option>
      <option value="General">General</option>
      <option value="Technology">Technology</option>
      <option value="Business">Business</option>
      <option value="Entertainment">Entertainment</option>
      <option value="Health">Health</option>
      <option value="Science">Science</option>
      <option value="Sports">Sports</option>
    </select>

    <select id="country-select" onchange="fetchNewsByCountry()">
      <option value="in">🇮🇳 India</option>
      <option value="us">🇺🇸 USA</option>
      <option value="gb">🇬🇧 UK</option>
      <option value="au">🇦🇺 Australia</option>
      <option value="ca">🇨🇦 Canada</option>
      <option value="de">🇩🇪 Germany</option>
      <option value="fr">🇫🇷 France</option>
      <option value="jp">🇯🇵 Japan</option>
    </select>

    <button onclick="searchNews()">🔎 Search</button>
  </div>

  <main>
    <div id="news-container" class="news-container"></div>
  </main>

  <footer class="footer">
    <p>© 2025 News Aggregator | Made with 💜</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
